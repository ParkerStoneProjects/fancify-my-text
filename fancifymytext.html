<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fancify Shamcify</title>
    <script src="fancifymytext.js" defer></script>
</head>
<body>
    <h1>Fancify my Text</h1>

    <fieldset>
        <legend>Text</legend>
        <textarea id="textInput" rows="4" cols="30"
                  aria-label="Text to fancify"></textarea>
    </fieldset>

    <fieldset>
        <legend>Fancify</legend>

        <button type="button" onclick="bigger()">Bigger!</button>
        <button type="button" onclick="moo()">Moo</button>

        <br>

        <input type="radio" id="fancyShmancy" name="style"
               onchange="changeStyle()">
        <label for="fancyShmancy">FancyShmancy</label>

        <br>

        <input type="radio" id="boringBetty" name="style"
               onchange="changeStyle()" checked>
        <label for="boringBetty">BoringBetty</label>
    </fieldset>
</body>
</html>
